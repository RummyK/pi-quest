<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>파이 탐험대 – 파이썬 기초 모험</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<style>
  @font-face{font-family:'Galmuri11';src:url('fonts/Galmuri11.woff2') format('woff2');font-weight:400;font-display:swap}
  @font-face{font-family:'Galmuri11';src:url('fonts/Galmuri11-Bold.woff2') format('woff2');font-weight:700;font-display:swap}
  @font-face{font-family:'GalmuriMono11';src:url('fonts/GalmuriMono11.woff2') format('woff2');font-display:swap}
  :root{
    --night:#0c2a47; --win:#134a73; --edge:#071a2e; --frame:#f6ecd2; --frame-shade:#c9b98f;
    --coin:#ffcc4d; --coin-shade:#d9961f; --leaf:#4fd1a5; --ember:#ff6f61; --sky:#7be7f0; --mute:#7fa6c9;
    --deep:#0a2238; --line:#2a6a95;
    --pix:'Galmuri11',sans-serif; --mono:'GalmuriMono11','Galmuri11',monospace;
  }
  *{box-sizing:border-box}
  html,body{background:var(--night)}
  body{margin:0;color:var(--frame);font-family:var(--pix);font-size:15px;line-height:1.6;-webkit-font-smoothing:none}
  button{font-family:inherit}
  canvas.px{image-rendering:pixelated;image-rendering:crisp-edges}

  /* ---------- 헤더 + 월드맵 ---------- */
  header{max-width:1380px;margin:0 auto;padding:16px 22px 0;display:flex;align-items:flex-end;gap:32px;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:12px;padding-bottom:6px}
  .logo canvas{width:52px;height:52px}
  .logo h1{margin:0;font-size:28px;line-height:1.1;font-weight:700;color:var(--coin);text-shadow:3px 3px 0 var(--edge)}
  .logo p{margin:2px 0 0;font-size:12px;color:var(--mute)}
  .who{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .who .id{color:var(--frame);font-size:13px}
  .who .sc{color:var(--coin);font-weight:700;font-size:13px}
  .who button{background:none;border:0;color:var(--mute);text-decoration:underline;font-size:12px;cursor:pointer;padding:0}
  .who button:hover{color:var(--frame)}
  .login{text-align:left;margin:4px 0 0}
  .login label{display:block;margin:0 0 12px;font-size:14px;color:var(--mute)}
  .login input{display:block;width:100%;margin-top:4px;font:18px var(--pix);background:var(--edge);color:var(--frame);border:0;padding:10px 12px;box-shadow:inset 0 0 0 3px var(--line)}
  .login input:focus{outline:none;box-shadow:inset 0 0 0 3px var(--coin)}
  .formerr{color:var(--ember);min-height:1.6em;margin:0 0 12px;font-size:14px}
  .mbox .small{font-size:13px;color:var(--mute);margin:0 0 16px}
  .map{list-style:none;margin:0;padding:22px 0 4px;display:flex;flex:1;min-width:280px;overflow-x:auto}
  .map li{position:relative;flex:1;min-width:72px;display:flex;flex-direction:column;align-items:center;gap:8px}
  .map li+li::before{content:'';position:absolute;top:15px;right:50%;width:100%;height:4px;z-index:0;
    background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 10px)}
  .map li.reached::before{background:repeating-linear-gradient(90deg,var(--coin) 0 6px,transparent 6px 10px)}
  .node{position:relative;z-index:1;width:34px;height:34px;border:0;padding:0;background:var(--win);color:var(--frame);
    font-weight:700;font-size:15px;box-shadow:0 0 0 3px var(--edge),inset 0 0 0 3px var(--frame);cursor:pointer}
  .node.done{background:var(--leaf);color:var(--edge)}
  .node.cur{background:var(--coin);color:var(--edge)}
  .node.locked{background:var(--edge);color:var(--line);box-shadow:0 0 0 3px var(--edge),inset 0 0 0 3px var(--line);cursor:not-allowed}
  .node.cur::after{content:'▼';position:absolute;top:-21px;left:50%;color:var(--coin);font-size:12px;animation:hop .7s steps(2) infinite}
  @keyframes hop{0%{transform:translate(-50%,0)}100%{transform:translate(-50%,4px)}}
  .pips{display:flex;gap:4px}
  .pip{width:9px;height:9px;padding:0;border:0;background:var(--deep);box-shadow:0 0 0 2px var(--line);cursor:pointer}
  .pip.done{background:var(--leaf);box-shadow:0 0 0 2px var(--edge)}
  .pip.cur{background:var(--coin);box-shadow:0 0 0 2px var(--edge)}
  .pip.locked{cursor:not-allowed;opacity:.5}
  .map .lbl{font-size:11px;color:var(--mute);white-space:nowrap}
  .map li.is-cur .lbl{color:var(--coin)}
  .map li.is-done .lbl{color:var(--frame)}

  /* ---------- 레이아웃 ---------- */
  main{max-width:1380px;margin:0 auto;padding:18px 22px 20px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(360px,1fr);gap:24px 30px;align-items:start}
  @media (max-width:1020px){main{grid-template-columns:1fr}}

  /* ---------- 게임 화면 ---------- */
  .screen{position:relative;aspect-ratio:4/3;background:#1c6a96;margin:8px;box-shadow:0 0 0 4px var(--frame),0 0 0 8px var(--edge)}
  .screen > canvas{position:absolute;inset:0;width:100%;height:100%}
  .hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
  .pill{background:var(--edge);color:var(--frame);padding:2px 10px;font-size:13px;box-shadow:0 0 0 2px var(--frame)}
  .pill b{color:var(--sky);font-weight:700}
  .loading{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);background:var(--edge);color:var(--coin);
    padding:8px 16px;font-size:14px;box-shadow:0 0 0 3px var(--frame);white-space:nowrap}
  .loading.hide{display:none}

  .dialog{position:absolute;left:14px;right:14px;bottom:14px;display:flex;gap:14px;align-items:flex-start;background:var(--win);
    border:4px solid var(--frame);box-shadow:0 0 0 3px var(--edge),inset 0 0 0 3px var(--edge);padding:14px 18px 14px 14px;cursor:pointer;min-height:100px;user-select:none}
  .portrait{flex:none;width:64px;height:64px;background:#f3d99c;box-shadow:0 0 0 3px var(--edge)}
  .portrait canvas{width:64px;height:64px;display:block}
  .dname{position:absolute;top:-17px;left:96px;background:var(--frame);color:var(--edge);font-weight:700;font-size:13px;padding:0 10px;box-shadow:0 0 0 3px var(--edge)}
  .dtext{font-size:17px;line-height:1.65;padding-top:2px;min-height:56px}
  .more{position:absolute;right:12px;bottom:4px;color:var(--coin);font-size:12px;animation:hop2 .7s steps(2) infinite}
  .more.hide{display:none}
  @keyframes hop2{100%{transform:translateY(4px)}}

  /* ---------- 오른쪽 창들 ---------- */
  .right{display:flex;flex-direction:column;gap:30px;padding-top:14px;min-width:0}
  .win{position:relative;background:var(--win);border:4px solid var(--frame);box-shadow:0 0 0 3px var(--edge),inset 0 0 0 3px var(--edge);padding:22px 18px 16px;margin:0 3px}
  .win > .tab{position:absolute;top:-16px;left:14px;background:var(--frame);color:var(--edge);font-weight:700;font-size:13px;padding:0 10px;box-shadow:0 0 0 3px var(--edge)}
  .levels{display:flex;gap:10px;margin:0 0 14px;flex-wrap:wrap}
  .lvbtn{font-weight:700;font-size:13px;border:0;padding:5px 10px;cursor:pointer;background:var(--deep);color:var(--mute);box-shadow:0 0 0 2px var(--line)}
  .lvbtn .st{color:var(--coin);margin-left:4px;letter-spacing:-1px}
  .lvbtn.done{color:var(--frame);box-shadow:0 0 0 2px var(--leaf)}
  .lvbtn.done::before{content:'✓ ';color:var(--leaf)}
  .lvbtn.cur{background:var(--coin);color:var(--edge);box-shadow:0 0 0 2px var(--edge)}
  .lvbtn.cur .st{color:var(--edge)}
  .lvbtn.cur.done::before{color:var(--edge)}
  .lvbtn.locked{opacity:.45;cursor:not-allowed}
  .lvbtn:focus-visible,.pip:focus-visible{outline:3px dashed var(--coin);outline-offset:4px}
  .quest h2{margin:0 0 6px;font-size:23px;line-height:1.3;color:var(--coin);font-weight:700}
  .goal{margin:0 0 14px;font-size:15px}
  .note{background:var(--edge);padding:10px 14px;font-size:14px;line-height:1.75;color:#cfe6f5}
  .note .h{display:block;color:var(--coin);font-size:12px}
  .note b{color:var(--sky);font-weight:700}
  .cmds{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .cmd{font:15px var(--mono);background:var(--edge);color:var(--coin);border:0;padding:5px 10px;cursor:pointer;box-shadow:inset 0 0 0 2px var(--line)}
  .cmd:hover{box-shadow:inset 0 0 0 2px var(--coin)}
  .cmd span{font-family:var(--pix);color:var(--mute);font-size:11px;margin-left:6px}

  .win.code{padding:14px 0 0}
  .editor{position:relative;display:flex;background:var(--edge);height:290px}
  .gutter{width:44px;flex:none;color:var(--line);font:16px/26px var(--mono);padding:12px 0;overflow:hidden;user-select:none;text-align:right;background:var(--deep)}
  .gutter div{padding-right:10px;height:26px}
  .gutter div.act{color:var(--coin)}
  .gutter div.err{color:var(--ember)}
  .codewrap{position:relative;flex:1;min-width:0}
  .hl{position:absolute;left:0;right:0;height:26px;background:rgba(255,204,77,.16);box-shadow:inset 4px 0 0 var(--coin);pointer-events:none;display:none}
  .hl.err{background:rgba(255,107,91,.18);box-shadow:inset 4px 0 0 var(--ember)}
  #code{position:absolute;inset:0;width:100%;height:100%;resize:none;border:0;outline:0;background:transparent;color:var(--frame);
    font:16px/26px var(--mono);padding:12px 14px;white-space:pre;overflow:auto;tab-size:4;caret-color:var(--coin)}
  #code::selection{background:var(--line)}

  .bar{display:flex;gap:14px;flex-wrap:wrap;margin:0 3px}
  .pbtn{font-weight:700;font-size:15px;color:var(--edge);background:var(--frame);border:0;padding:10px 15px;cursor:pointer;
    box-shadow:0 0 0 3px var(--edge),inset -4px -4px 0 var(--frame-shade)}
  .pbtn:active{box-shadow:0 0 0 3px var(--edge),inset 4px 4px 0 var(--frame-shade)}
  .pbtn.run{background:var(--coin);flex:1;min-width:170px;font-size:19px;box-shadow:0 0 0 3px var(--edge),inset -4px -4px 0 var(--coin-shade)}
  .pbtn.run:active{box-shadow:0 0 0 3px var(--edge),inset 4px 4px 0 var(--coin-shade)}
  .pbtn.run:disabled{background:#3d6d93;color:#0f3355;box-shadow:0 0 0 3px var(--edge),inset -4px -4px 0 #2f5a7d;cursor:wait}
  .pbtn .key{font-size:11px;font-weight:400;opacity:.7;margin-left:6px}
  .pbtn:focus-visible,.node:focus-visible,.cmd:focus-visible,.dialog:focus-visible{outline:3px dashed var(--coin);outline-offset:6px}

  .win.log{padding:20px 16px 12px}
  .logbox{font:14px/1.75 var(--mono);min-height:96px;max-height:210px;overflow:auto}
  .logbox div{white-space:pre-wrap;word-break:break-all}
  .c-out{color:var(--frame)}
  .c-out::before{content:'▶ ';color:var(--coin)}
  .c-info{color:var(--mute)}
  .c-warn{color:var(--coin)}
  .c-ok{color:var(--leaf)}
  .c-err{color:#ffc2ba;background:rgba(255,107,91,.12);box-shadow:inset 4px 0 0 var(--ember);padding:6px 12px;margin:6px 0}
  .c-err b{color:var(--ember);font-weight:400}
  .c-err .raw{color:#8fb0c9;font-size:12px}

  footer{max-width:1380px;margin:0 auto;padding:4px 22px 26px;font-size:12px;color:var(--mute);display:flex;gap:18px;flex-wrap:wrap}
  footer button{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;font-size:12px;padding:0}
  footer button:hover{color:var(--frame)}

  .modal{position:fixed;inset:0;background:rgba(7,26,46,.72);display:none;align-items:center;justify-content:center;z-index:30;padding:20px}
  .modal.show{display:flex}
  .mbox{background:var(--win);border:4px solid var(--frame);box-shadow:0 0 0 4px var(--edge),inset 0 0 0 3px var(--edge);padding:26px 30px 26px;text-align:center;max-width:460px;width:100%;animation:pop .4s steps(4)}
  .mbox canvas{width:80px;height:80px}
  .mbox h3{font-size:40px;line-height:1.2;color:var(--coin);margin:4px 0 8px;font-weight:700;text-shadow:4px 4px 0 var(--edge)}
  .mbox p{margin:0 0 20px}
  .mbox p b{color:var(--coin);font-weight:700}
  .mbox ol{text-align:left;margin:0 auto 22px;padding-left:28px;max-width:280px;line-height:1.9;color:#cfe6f5}
  .mbox .bar{justify-content:center}
  @keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
  @media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>
</head>
<body>

<header>
  <div class="logo">
    <canvas class="px" id="logoDino" width="16" height="16"></canvas>
    <div><h1>파이 탐험대</h1><p class="who" id="who">코드로 공룡을 움직이는 파이썬 바다 모험</p></div>
  </div>
  <ol class="map" id="map" aria-label="단원 지도"></ol>
</header>

<main>
  <section>
    <div class="screen" id="screen">
      <canvas class="px" id="game"></canvas>
      <div class="hud">
        <span class="pill" id="hudGem"></span>
        <span class="pill" id="hudTest" style="display:none"></span>
      </div>
      <div class="loading" id="loading">파이썬 엔진을 불러오는 중… (처음엔 10초쯤 걸려요)</div>
      <div class="dialog" id="dialog" tabindex="0" aria-live="polite">
        <span class="dname">거북 쌤</span>
        <div class="portrait"><canvas class="px" id="owlFace" width="16" height="16"></canvas></div>
        <div class="dtext" id="dtext"></div>
        <span class="more hide" id="more">▼</span>
      </div>
    </div>
  </section>

  <section class="right">
    <div class="win quest">
      <span class="tab" id="sTab">퀘스트</span>
      <div class="levels" id="sLevels" role="tablist" aria-label="난이도"></div>
      <h2 id="sTitle"></h2>
      <p class="goal" id="sGoal"></p>
      <div class="note"><span class="h">거북 쌤 노트</span><span id="sConcept"></span></div>
      <div class="cmds" id="sCmds"></div>
    </div>

    <div class="win code">
      <span class="tab">코드</span>
      <div class="editor">
        <div class="gutter" id="gutter"></div>
        <div class="codewrap">
          <div class="hl" id="hl"></div>
          <textarea id="code" spellcheck="false" wrap="off" autocomplete="off" autocapitalize="off" aria-label="파이썬 코드"></textarea>
        </div>
      </div>
    </div>

    <div class="bar">
      <button class="pbtn run" id="runBtn" disabled>준비 중…</button>
      <button class="pbtn" id="hintBtn">힌트</button>
      <button class="pbtn" id="speedBtn">속도 1x</button>
      <button class="pbtn" id="resetBtn">처음 코드로</button>
    </div>

    <div class="win log">
      <span class="tab">실행 기록</span>
      <div class="logbox" id="console"></div>
    </div>
  </section>
</main>

<footer>
  <span>진행 상황은 이 브라우저에 저장돼요.</span>
  <button id="muteBtn">소리 끄기</button>
  <button id="unlockBtn">전체 퀘스트 열기 (교사용)</button>
  <button id="wipeBtn">진행 상황 초기화</button>
  <span>폰트: 갈무리(Galmuri, OFL)</span>
</footer>

<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>

<script type="text/python" id="runner">
import sys, json, builtins

USER_FILE = "<내 코드>"

class _Stop(Exception):
    pass

def _user_line_from_tb(e):
    ln = 0
    tb = e.__traceback__
    while tb is not None:
        if tb.tb_frame.f_code.co_filename == USER_FILE:
            ln = tb.tb_lineno
        tb = tb.tb_next
    return ln

def _cur_line():
    f = sys._getframe(1)
    while f is not None:
        if f.f_code.co_filename == USER_FILE:
            return f.f_lineno
        f = f.f_back
    return 0

def _run(code, cfg_json):
    cfg = json.loads(cfg_json)
    grid = [list(r) for r in cfg["map"]]
    H = len(grid)
    W = len(grid[0])
    st = {"x": 0, "y": 0, "d": cfg.get("dir", 0), "steps": 0, "checks": 0}
    for yy, row in enumerate(grid):
        for xx, c in enumerate(row):
            if c == "S":
                st["x"], st["y"] = xx, yy
                grid[yy][xx] = "."
    DX = [1, 0, -1, 0]
    DY = [0, -1, 0, 1]
    log = []
    out = []

    def cell(x, y):
        if 0 <= y < H and 0 <= x < W:
            return grid[y][x]
        return "#"

    def blocked(c):
        return c in "#O"

    def act(a, **kw):
        st["steps"] += 1
        if st["steps"] > 300:
            raise _Stop("명령을 너무 많이 실행했어요! 반복이 끝나지 않는 건 아닐까요?")
        e = {"a": a, "x": st["x"], "y": st["y"], "d": st["d"], "line": _cur_line()}
        e.update(kw)
        log.append(e)

    def ahead(n=1):
        return st["x"] + DX[st["d"]] * n, st["y"] + DY[st["d"]] * n

    def check_limit():
        st["checks"] += 1
        if st["checks"] > 1000:
            raise _Stop("반복이 끝나지 않아요! 반복 안에서 move()를 했는지 확인해 보세요.")

    def move():
        nx, ny = ahead()
        c = cell(nx, ny)
        if blocked(c):
            act("bump")
            raise _Stop("앞은 바다라서 갈 수 없어요! 방향을 확인해 보세요.")
        st["x"], st["y"] = nx, ny
        if c == "T":
            act("fall")
            raise _Stop("앗, 따가워! 성게 함정을 밟았어요. 함정은 jump()로 뛰어넘어야 해요.")
        act("move")

    def jump():
        mx, my = ahead(1)
        lx, ly = ahead(2)
        if blocked(cell(mx, my)) or blocked(cell(lx, ly)):
            act("bump")
            raise _Stop("점프하면 바다에 빠져요! 점프할 공간이 없어요.")
        st["x"], st["y"] = lx, ly
        if cell(lx, ly) == "T":
            act("fall")
            raise _Stop("앗, 따가워! 성게 위로 착지했어요.")
        act("jump")

    def turn_left():
        st["d"] = (st["d"] + 1) % 4
        act("turn")

    def turn_right():
        st["d"] = (st["d"] + 3) % 4
        act("turn")

    def pick():
        if cell(st["x"], st["y"]) == "*":
            grid[st["y"]][st["x"]] = "."
            act("pick")
        else:
            act("nopick")
            raise _Stop("여기에는 진주가 없어요. 진주가 있는 칸에서 pick() 해야 해요.")

    def look():
        check_limit()
        c = cell(*ahead())
        return {"T": "함정", "*": "진주", "#": "바다", "O": "거북 쌤"}.get(c, "길")

    def is_pearl():
        check_limit()
        return cell(st["x"], st["y"]) == "*"

    def front_is_clear():
        check_limit()
        return not blocked(cell(*ahead()))

    def _print(*args, sep=" ", end="\n", **kw):
        s = str(sep).join(str(a) for a in args)
        out.append(s)
        act("say", text=s)

    def _input(*a, **k):
        raise _Stop("이 게임에서는 input()을 쓰지 않아요. 값을 직접 변수에 넣어 보세요.")

    api = dict(move=move, jump=jump, turn_left=turn_left, turn_right=turn_right,
               pick=pick, look=look, front_is_clear=front_is_clear, is_pearl=is_pearl)
    g = {"__name__": "__main__", "__builtins__": builtins, "print": _print, "input": _input}
    g.update(api)

    counter = [0]
    def tracer(frame, event, arg):
        if frame.f_code.co_filename == USER_FILE:
            if event == "line":
                counter[0] += 1
                if counter[0] > 50000:
                    raise _Stop("코드가 끝나지 않아요! 무한 반복이 있는지 확인해 보세요.")
            return tracer
        return None

    err = None
    compiled = None
    try:
        compiled = compile(code, USER_FILE, "exec")
    except SyntaxError as e:
        err = {"kind": "py", "type": type(e).__name__, "msg": str(e.msg), "line": e.lineno or 0}
    if compiled is not None:
        sys.settrace(tracer)
        try:
            exec(compiled, g)
        except _Stop as e:
            err = {"kind": "stop", "type": "Stop", "msg": str(e), "line": _user_line_from_tb(e)}
        except Exception as e:
            err = {"kind": "py", "type": type(e).__name__, "msg": str(e), "line": _user_line_from_tb(e)}
        finally:
            sys.settrace(None)

    vs = {}
    for k, v in g.items():
        if k.startswith("_") or k in api or k in ("print", "input"):
            continue

    g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);

}

const INK = '#071a2e';
const DX = [1, 0, -1, 0], DY = [0, -1, 0, 1];
const WD = { grid: [], w: 1, h: 1, total: 0, got: 0 };
const P = { x: 0, y: 0, d: 0, face: 1, tw: null, bump: null, fall: null };

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;

function layout() {
  const dlg = ($('#dialog').offsetHeight + 28) * DPR;
  const availW = cv.width - 40 * DPR, availH = cv.height - dlg - 56 * DPR;
  let s = Math.floor(Math.min(availW / (16 * WD.w), availH / (16 * WD.h)));
  s = Math.max(1, Math.min(s, Math.round(6 * DPR)));
  const T = 16 * s;
  const ox = Math.round((cv.width - T * WD.w) / 2);
  const oy = Math.round(Math.max(48 * DPR, 44 * DPR + (cv.height - dlg - 44 * DPR - T * WD.h) / 2));
  return { s, T, ox, oy };
}
function spr(name, x, y, s, flip = false, scale = 1) {
  const w = 16 * s * scale;
  x = Math.round(x + (16 * s - w) / 2); y = Math.round(y + (16 * s - w));
  if (flip) { ctx.save(); ctx.translate(x + w, y); ctx.scale(-1, 1); ctx.drawImage(sprCache[name], 0, 0, w, w); ctx.restore(); }
  else ctx.drawImage(sprCache[name], x, y, w, w);
}
function wrapText(text, maxW) {
  const lines = []; let cur = '';
  for (const ch of String(text)) {
    if (ch === '\n') { lines.push(cur); cur = ''; continue; }
    if (ctx.measureText(cur + ch).width > maxW && cur) { lines.push(cur); cur = ch; } else cur += ch;
  }
  lines.push(cur);
  if (lines.length > 3) { lines.length = 3; lines[2] = lines[2].slice(0, -1) + '…'; }
  return lines;
}
function pixBox(x, y, w, h, fill, b) {
  ctx.fillStyle = INK;
  ctx.fillRect(x - b, y, w + 2 * b, h); ctx.fillRect(x, y - b, w, h + 2 * b);
  ctx.fillStyle = fill; ctx.fillRect(x, y, w, h);
}
function drawBubble(cx, bottom, text, fill = '#f6ecd2') {
  const U = DPR, fs = Math.round(15 * U), b = Math.round(3 * U), st = Math.round(3 * U);
  ctx.font = `${fs}px Galmuri11, sans-serif`;
  const lines = wrapText(text, Math.min(260 * U, cv.width * .55));
  const lh = Math.round(fs * 1.35);
  const w = Math.ceil(Math.max(...lines.map(l => ctx.measureText(l).width))) + Math.round(18 * U);
  const h = lines.length * lh + Math.round(12 * U);
  const x = Math.round(clamp(cx - w / 2, 8 * U, cv.width - w - 8 * U));
  let y = Math.round(bottom - h - 4 * st); if (y < 8 * U) y = Math.round(8 * U);
  pixBox(x, y, w, h, fill, b);
  cx = Math.round(clamp(cx, x + 4 * st, x + w - 4 * st));
  for (let j = 0; j < 3; j++) {
    const half = (3 - j) * st;
    ctx.fillStyle = INK; ctx.fillRect(cx - half - b, y + h + j * st, 2 * half + 2 * b, st);
    ctx.fillStyle = fill; ctx.fillRect(cx - half, y + h + j * st - (j === 0 ? b : 0), 2 * half, st + (j === 0 ? b : 0));
  }
  ctx.fillStyle = INK; ctx.fillRect(cx - b, y + h + 3 * st, 2 * b, b);
  ctx.textBaseline = 'top'; ctx.textAlign = 'left';
  lines.forEach((l, i) => ctx.fillText(l, x + Math.round(9 * U), y + Math.round(7 * U) + i * lh));
}
function burst(gx, gy) {
  const { T, ox, oy } = layout();
  const cx = ox + (gx + .5) * T, cy = oy + (gy + .5) * T;
  for (let i = 0; i < 16; i++) {
    const a = Math.random() * Math.PI * 2, sp = (70 + Math.random() * 110) * DPR;
    particles.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 70 * DPR, life: 1, c: ['#ffcc4d', '#fdfaf2', '#ff9fc0', '#7be7f0'][i % 4] });
  }
}
function drawArrow(cx, cy, T, s, d) {
  const steps = [5, 3, 1];
  ctx.fillStyle = '#ffcc4d';
  const base = T * .5 + s;
  steps.forEach((len, i) => {
    for (let k = 0; k < len; k++) {
      const along = base + i * s, across = (k - (len - 1) / 2) * s;
      let x, y;
      if (d === 0) { x = cx + along; y = cy + across; }
      else if (d === 2) { x = cx - along - s; y = cy + across; }
      else if (d === 1) { x = cx + across; y = cy - along - s; }
      else { x = cx + across; y = cy + along; }
      ctx.fillRect(Math.round(x - (d % 2 ? s / 2 : 0)), Math.round(y - (d % 2 ? 0 : s / 2)), s, s);
    }
  });
}
const isWater = (x, y) => y < 0 || y >= WD.h || x < 0 || x >= WD.w || WD.grid[y][x] === '#';
function drawFoam(px, py, x, y, s, T, t) {
  // 모래 가장자리에 부서지는 파도
  const ph = Math.floor(t * 2) % 2;
  ctx.fillStyle = '#e9fbff';
  for (let k = 0; k < 16; k++) {
    if ((k + ph) % 3 === 0) continue;
    if (isWater(x, y - 1)) ctx.fillRect(px + k * s, py, s, s);
    if (isWater(x, y + 1)) ctx.fillRect(px + k * s, py + T - s, s, s);
    if (isWater(x - 1, y)) ctx.fillRect(px, py + k * s, s, s);
    if (isWater(x + 1, y)) ctx.fillRect(px + T - s, py + k * s, s, s);
  }
}

let lastT = performance.now();
function frame(now) {
  const t = now / 1000, dt = Math.min(.05, (now - lastT) / 1000); lastT = now;
  ctx.imageSmoothingEnabled = false;
  const { s, T, ox, oy } = layout();
  const wf = Math.floor(t * 1.4) % 2;

  // 깊은 바다
  const sx = ox - Math.ceil(ox / T) * T, sy = oy - Math.ceil(oy / T) * T;
  for (let y = sy; y < cv.height; y += T) for (let x = sx; x < cv.width; x += T) ctx.drawImage(sprCache['deep' + wf], x, y, T, T);

  // 얕은 바다 + 모래
  WD.grid.forEach((row, y) => row.forEach((c, x) => {
    const px = ox + x * T, py = oy + y * T;
    if (c === '#') { ctx.drawImage(sprCache['shallow' + ((wf + x + y) % 2)], px, py, T, T); return; }
    const h = (x * 7 + y * 13) % 9;
    const g = h === 1 ? 'sand1' : h === 4 ? 'sand2' : h === 7 ? 'sand3' : 'sand0';
    ctx.drawImage(sprCache[g], px, py, T, T);
    drawFoam(px, py, x, y, s, T, t);
  }));

  let owlPos = null;
  const sprites = [];
  WD.grid.forEach((row, y) => row.forEach((c, x) => {
    const px = ox + x * T, py = oy + y * T;
    if (c === 'T') spr('urchin', px, py, s);
    else if (c === '*') sprites.push([y, () => spr('pearl', px, py - (Math.floor(t * 2.5 + x) % 2) * s, s)]);
    else if (c === 'O') { owlPos = [px + T / 2, py]; sprites.push([y, () => spr('turtle', px, py - (Math.floor(t * 1.5) % 2) * s, s)]); }
  }));

  // 파이
  let px = P.x, py = P.y, hop = 0, sc = 1, moving = false;
  if (P.tw) {
    const k = clamp((now - P.tw.s) / P.tw.dur), e = ease(k);
    px = lerp(P.tw.fx, P.tw.tx, e); py = lerp(P.tw.fy, P.tw.ty, e);
    hop = Math.sin(Math.PI * k) * P.tw.hop; moving = true;
    if (k >= 1) P.tw = null;
  }
  if (P.bump) {
    const k = clamp((now - P.bump.s) / P.bump.dur);
    const off = Math.sin(Math.PI * k) * .22;
    px += DX[P.d] * off; py += DY[P.d] * off;
    if (k >= 1) P.bump = null;
  }
  if (P.fall) sc = 1 - clamp((now - P.fall.s) / P.fall.dur);
  const dinoX = ox + px * T, dinoY = oy + py * T;
  const bob = moving ? 0 : (Math.floor(t * 2) % 2) * s;
  const lift = Math.round(hop * T / s) * s;
  sprites.push([py + .01, () => {
    if (sc > .02) {
      ctx.fillStyle = 'rgba(7,26,46,.25)';
      ctx.fillRect(Math.round(dinoX + 4 * s), Math.round(dinoY + 14 * s), 8 * s * sc, 2 * s);
      const fr = moving && Math.floor(now / 110) % 2 ? 'dino1' : 'dino0';
      spr(fr, Math.round(dinoX), Math.round(dinoY - lift + bob), s, P.face < 0, sc);
    }
  }]);
  sprites.sort((a, b) => a[0] - b[0]).forEach(([, f]) => f());

  if (sc > .9 && !P.tw && Math.floor(t * 2.5) % 2) drawArrow(Math.round(dinoX + T / 2), Math.round(dinoY + T / 2), T, s, P.d);
  const headY = dinoY - lift + bob;
  if (prog.name && sc > .9) {
    const fs = Math.round(12 * DPR);
    ctx.font = `${fs}px Galmuri11, sans-serif`;
    const w = Math.ceil(ctx.measureText(prog.name).width) + Math.round(10 * DPR), h = fs + Math.round(6 * DPR);
    const x = Math.round(dinoX + T / 2 - w / 2), y = Math.round(headY - h + s);
    pixBox(x, y, w, h, '#134a73', Math.round(2 * DPR));
    ctx.fillStyle = '#f6ecd2'; ctx.textBaseline = 'top'; ctx.textAlign = 'left';
    ctx.fillText(prog.name, x + Math.round(5 * DPR), y + Math.round(3 * DPR));
  }
  ctx.fillStyle = INK;
  if (bubble && now < bubble.until) { drawBubble(dinoX + T / 2, headY - (prog.name ? 16 * DPR : 0), bubble.text); }
  if (owlBubble && owlPos && now < owlBubble.until) drawBubble(owlPos[0], owlPos[1], owlBubble.text, '#ffe9a8');

  particles = particles.filter(p => (p.life -= dt * 1.5) > 0);
  particles.forEach(p => {
    p.vy += 320 * DPR * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    ctx.fillStyle = p.c; ctx.fillRect(Math.round(p.x / s) * s, Math.round(p.y / s) * s, s, s);
  });
  requestAnimationFrame(frame);
}

let speed = 1;
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function playStep(e) {
  const D = ms => ms / speed, now = () => performance.now();
  setActiveLine(e.line);
  switch (e.a) {
    case 'move': case 'jump': {
      const dur = D(e.a === 'jump' ? 520 : 320);
      P.tw = { fx: P.x, fy: P.y, tx: e.x, ty: e.y, s: now(), dur, hop: e.a === 'jump' ? .9 : .08 };
      P.x = e.x; P.y = e.y; e.a === 'jump' ? sfx.jump() : sfx.step();
      await sleep(dur + 15); break;
    }
    case 'turn':
      P.d = e.d; if (e.d === 0) P.face = 1; if (e.d === 2) P.face = -1;
      await sleep(D(240)); break;
    case 'say':
      bubble = { text: e.text === '' ? '…' : e.text, until: now() + D(1200) };
      logLine('out', e.text); sfx.say();
      await sleep(D(950)); break;
    case 'pick':
      WD.grid[e.y][e.x] = '.'; WD.got++; updateHud(); burst(e.x, e.y); sfx.pick();
      await sleep(D(420)); break;
    case 'nopick':
      bubble = { text: '어? 여긴 진주가 없네…', until: now() + D(1200) };
      await sleep(D(800)); break;
    case 'bump':
      P.bump = { s: now(), dur: D(380) }; sfx.bump();
      bubble = { text: '앞은 바다야!', until: now() + D(900) };
      await sleep(D(450)); break;
    case 'fall': {
      const dur = D(300);
      P.tw = { fx: P.x, fy: P.y, tx: e.x, ty: e.y, s: now(), dur, hop: .1 };
      P.x = e.x; P.y = e.y; await sleep(dur);
      bubble = { text: '앗, 따가워!', until: now() + D(1000) };
      P.bump = { s: now(), dur: D(300) }; sfx.bump();
      await sleep(D(650)); break;
    }
  }
}

/* ================= 오류 메시지 한국어 풀이 ================= */
function explainError(err) {
  const L = err.line ? `${err.line}번째 줄` : '코드';
  const m = err.msg || '';
  if (err.kind === 'stop') return { title: m, detail: err.line ? `(${L}에서 멈췄어요)` : '' };
  switch (err.type) {
    case 'IndentationError': case 'TabError':
      if (/unexpected indent/.test(m)) return { title: `${L}: 필요 없는 들여쓰기가 있어요`, detail: 'if, for, while, def 블록 안이 아니라면 줄 맨 앞에 공백이 없어야 해요.' };
      if (/expected an indented block/.test(m)) return { title: `${L}: 들여쓰기가 필요해요`, detail: '콜론(:)으로 끝나는 줄 다음 줄은 스페이스 4칸 들여 써야 해요. 비워 둘 거면 pass 를 써요.' };
      if (/unindent does not match/.test(m)) return { title: `${L}: 들여쓰기 칸 수가 맞지 않아요`, detail: '같은 블록에 있는 줄은 들여쓰기 칸 수가 똑같아야 해요.' };
      return { title: `${L}: 들여쓰기 오류`, detail: '줄 앞의 공백을 확인해 보세요.' };
    case 'SyntaxError':
      if (/never closed|unexpected EOF/.test(m)) return { title: `${L}: 괄호가 닫히지 않았어요`, detail: '여는 괄호 ( 마다 닫는 괄호 ) 가 있어야 해요.' };
      if (/unmatched/.test(m)) return { title: `${L}: 짝이 안 맞는 괄호가 있어요`, detail: '닫는 괄호 ) 가 너무 많지 않은지 확인해요.' };
      if (/unterminated string|EOL while scanning/.test(m)) return { title: `${L}: 따옴표가 닫히지 않았어요`, detail: '문자열은 "로 시작하면 "로 끝나야 해요.' };
      if (/expected ':'/.test(m)) return { title: `${L}: 콜론(:)이 빠졌어요`, detail: 'if, else, for, while, def 줄 끝에는 : 이 꼭 필요해요.' };
      if (/invalid character|invalid non-printable/.test(m)) return { title: `${L}: 이상한 문자가 들어 있어요`, detail: '한글 자판의 “ ” ‘ ’ （ ） 같은 기호 대신 영문 자판의 " ( ) 를 써요.' };
      if (/Maybe you meant '=='|cannot assign/.test(m)) return { title: `${L}: = 와 == 를 확인해요`, detail: '값을 넣을 땐 = 하나, 같은지 비교할 땐 == 두 개를 써요.' };
      if (/Perhaps you forgot a comma/.test(m)) return { title: `${L}: 쉼표나 따옴표가 빠진 것 같아요`, detail: '글자는 따옴표로 감싸고, 여러 값은 쉼표로 구분해요.' };
      return { title: `${L}: 문법이 맞지 않아요`, detail: '괄호 ( ), 따옴표 " ", 콜론 : 을 하나씩 확인해 보세요.' };
    case 'NameError': {
      const nm = (m.match(/name '([^']+)'/) || [])[1] || '';
      const known = ['move', 'jump', 'turn_left', 'turn_right', 'pick', 'look', 'front_is_clear', 'is_pearl', 'print', 'range'];
      const k = known.find(x => x.toLowerCase() === nm.toLowerCase() && x !== nm);
      const tip = k ? `혹시 ${k} 아닌가요? 파이썬은 대문자와 소문자를 구분해요.`
        : '철자가 틀리진 않았나요? 글자(문자열)라면 따옴표 " " 로 감싸야 해요. 변수라면 먼저 값을 넣어야 해요.';
      return { title: `${L}: '${nm}'이(가) 무엇인지 몰라요`, detail: tip };
    }
    case 'TypeError':
      if (/can only concatenate str|unsupported operand type/.test(m)) return { title: `${L}: 문자와 숫자를 바로 더할 수 없어요`, detail: 'str(숫자)로 바꾸거나, print(a, b)처럼 쉼표로 이어 보세요.' };
      if (/positional argument|takes \d+ positional|missing \d+ required/.test(m)) return { title: `${L}: 괄호 안 값의 개수가 맞지 않아요`, detail: '예: move() 는 괄호 안을 비워 두어요.' };
      if (/not callable/.test(m)) return { title: `${L}: 명령이 아닌 것을 ()로 불렀어요`, detail: '변수 이름 뒤에 괄호를 붙이지 않았는지 확인해요.' };
      return { title: `${L}: 자료형 오류`, detail: '숫자, 문자열 같은 값의 종류를 확인해 보세요.' };
    case 'ZeroDivisionError': return { title: `${L}: 0으로 나눌 수 없어요`, detail: '' };
    case 'ValueError': return { title: `${L}: 값이 올바르지 않아요`, detail: '' };
    default: return { title: `${L}: ${err.type} 오류`, detail: '' };
  }
}
function lintBareCalls(code) {
  const warns = [];

    const m = line.replace(/#.*$/, '').match(/^\s*(move|jump|turn_left|turn_right|pick|look|front_is_clear|is_pearl|print|step|turn_around)\s*$/);
    if (m) warns.push(`주의: ${i + 1}번째 줄: ${m[1]} 뒤에 괄호 ()를 붙여야 명령이 실행돼요!`);

}

    catch (e) { r = { log: [], out: [], vars: {}, gemsLeft: 1, err: { kind: 'stop', msg: '실행 중에 알 수 없는 문제가 생겼어요.', line: 0 } }; }

    if (s.tests.length > 1) logLine('ok', `테스트 ${i + 1} 통과`);

                     tries: prog.tries[i] || 0, code: (prog.code[i] || '').slice(0, 3000) };
      let r;
      try { r = await (await withTimeout(fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(body) }), 12000)).json(); }
      catch (e) { logLine('warn', '점수를 보내지 못했어요. 인터넷이 연결되면 다음에 자동으로 다시 보내요.'); break; }
      if (!r.ok) { logLine('warn', '점수 저장 실패: ' + r.error); break; }
      prog.pending.shift(); saveProg();
      if (r.first) logLine('ok', `점수 저장 완료 (${id} +${r.points}점, 선생님 기록 총 ${r.total}점)`);
    }
  } finally { syncing = false; }
}
function showLogin(canCancel) {
  modalLocked = !canCancel;
  mbox.innerHTML = `<canvas class="px" id="mIcon" width="16" height="16"></canvas><h3 style="font-size:30px">탐험가 등록</h3>
    <p class="small">${SCRIPT_URL ? '학번과 이름을 입력하면 클리어 점수가 선생님께 전달돼요.' : '학번과 이름을 입력해요. (점수 서버가 설정되지 않아 이 컴퓨터에만 저장돼요)'}</p>
    <form class="login" id="loginForm" autocomplete="off">
      <label>학번<input id="inSid" inputmode="numeric" maxlength="6" placeholder="예: 20315" value="${student ? esc(student.sid) : ''}"></label>
      <label>이름<input id="inName" maxlength="20" placeholder="예: 김파이" value="${student ? esc(student.name) : ''}"></label>
      <p class="formerr" id="loginErr" role="alert"></p>
      <div class="bar">${canCancel ? '<button type="button" class="pbtn" id="mCancel">취소</button>' : ''}<button type="submit" class="pbtn run" id="mGo">시작하기</button></div>
    </form>`;
  paintTo($('#mIcon'), 'dino0');
  if (canCancel) $('#mCancel').onclick = () => closeModal(true);
  $('#loginForm').onsubmit = async e => {
    e.preventDefault();
    const sid = $('#inSid').value.trim(), name = $('#inName').value.trim(), err = $('#loginErr');
    if (!/^\d{4,6}$/.test(sid)) { err.textContent = '학번은 숫자 4~6자리로 입력해요.'; return; }
    if (!name) { err.textContent = '이름을 입력해요.'; return; }
    const btn = $('#mGo'); btn.disabled = true; btn.textContent = '확인 중…'; err.textContent = '';
    let server = null, offline = false;
    if (SCRIPT_URL) {
      try { server = await fetchProgress(sid, name); }
      catch (x) { offline = true; }
      if (server && !server.ok) { err.textContent = server.error; btn.disabled = false; btn.textContent = '시작하기'; return; }
    }
    student = { sid, name };
    try { localStorage.setItem(PROFILE_KEY, JSON.stringify(student)); } catch (x) {}
    prog = loadProg();
    if (server) mergeServer(server.cleared);
    if (!prog.name) prog.name = name.slice(0, 12);
    saveProg();
    closeModal(true);
    renderWho();
    const start = STAGES.findIndex((s, i) => !prog.cleared[i] && isUnlocked(i));
    goStage(start < 0 ? 0 : start);
    if (offline) logLine('warn', '점수 서버에 연결하지 못했어요. 일단 이 컴퓨터에 저장하고, 연결되면 다시 보내요.');
    else if (server && server.cleared && server.cleared.length) logLine('ok', `지난 기록을 불러왔어요. (${server.cleared.length}개 퀘스트, ${server.total}점)`);
    syncScores();
  };
  modal.classList.add('show');
  setTimeout(() => $(student ? '#mGo' : '#inSid').focus(), 50);
}

/* ================= 시작 ================= */
paintTo($('#logoDino'), 'dino0');
paintTo($('#owlFace'), 'turtle');
resize();
if (prog.unlockAll) $('#unlockBtn').textContent = '퀘스트 잠금 다시 켜기';
{
  const start = STAGES.findIndex((s, i) => !prog.cleared[i] && isUnlocked(i));
  goStage(start < 0 ? 0 : start);
}
setRunBtn();
renderWho();
if (!student) showLogin(false);
else if (SCRIPT_URL) {
  fetchProgress(student.sid, student.name).then(r => {
    if (r.ok) { const before = Object.keys(prog.cleared).length; mergeServer(r.cleared); saveProg(); renderWho();
      if (Object.keys(prog.cleared).length !== before && !running) goStage(cur); }
  }).catch(() => {}).finally(syncScores);
}
(document.fonts ? document.fonts.load('15px Galmuri11') : Promise.resolve()).catch(() => {}).finally(() => requestAnimationFrame(frame));
(async () => {
  try {
    const py = await loadPyodide();
    py.runPython(document.getElementById('runner').textContent);
    pyRun = py.globals.get('_run');
    $('#loading').classList.add('hide');
  } catch (e) {
    $('#loading').textContent = '파이썬 엔진을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.';
  }
  setRunBtn();
})();
